<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achadinhos da Internet 🚀 | As Melhores Ofertas</title> 

<!-- Ícones da Marca -->
<link rel="icon" type="image/png" href="https://heyidllnarvytnhglywl.supabase.co/storage/v1/object/public/logos/49376.png">
<link rel="apple-touch-icon" href="https://heyidllnarvytnhglywl.supabase.co/storage/v1/object/public/logos/49376.png">

<!-- PWA e Tema -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090919"> 

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Phosphor Icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<!-- SDK do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 

<style>
/* Melhorias na Barra de Rolagem */
::-webkit-scrollbar {
width: 6px;
height: 6px;
}
::-webkit-scrollbar-track {
background: #090919;
}
::-webkit-scrollbar-thumb {
background: #2A2A4A;
border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
background: #00FFFF;
} 

/* Animação suave para o botão do WhatsApp */
@keyframes pulse-soft {
0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
50% { transform: scale(1.05); box-shadow: 0 0 15px 5px rgba(37, 211, 102, 0.2); }
}
.whatsapp-float {
animation: pulse-soft 2.5s infinite;
} 

/* Ocultar barra de rolagem nos filtros de categoria */
.scrollbar-none::-webkit-scrollbar {
display: none;
}
</style>
</head>
<body class="bg-[#090919] text-white min-h-screen font-sans pb-20 selection:bg-[#00FFFF] selection:text-black"> 

<!-- CABEÇALHO (Glassmorphism) -->
<header class="bg-[#121225]/70 backdrop-blur-lg border-b border-[#2A2A4A] p-4 sticky top-0 z-40 shadow-md">
<div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4"> 

<!-- Logo e Título -->
<div class="flex items-center gap-3 w-full md:w-auto">
<div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#00FFFF] to-[#FF00FF] flex items-center justify-center text-black shadow-lg shadow-[#00FFFF]/20 shrink-0 overflow-hidden">
<img src="https://heyidllnarvytnhglywl.supabase.co/storage/v1/object/public/logos/49376.png" alt="Logo" class="w-full h-full object-cover" onerror="this.remove()">
</div>
<div>
<h1 class="text-xl font-black bg-gradient-to-r from-[#00FFFF] via-white to-[#FF00FF] bg-clip-text text-transparent">
Achadinhos da Internet
</h1>
<p class="text-xs text-gray-400 font-medium">As melhores ofertas selecionadas</p>
</div>
</div> 

<!-- BARRA DE PESQUISA -->
<div class="relative w-full md:w-96 group">
<i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-[#00FFFF] transition-colors"></i>
<input type="text" id="searchInput" oninput="applyFilters()" placeholder="Buscar por título, categoria..."
class="w-full bg-[#1B1B3A]/50 border border-[#2A2A4A] rounded-full pl-11 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#00FFFF] focus:bg-[#1B1B3A] focus:shadow-[0_0_15px_rgba(0,255,255,0.1)] transition-all">
</div>
</div>
</header> 

<!-- ÁREA PRINCIPAL -->
<main class="max-w-6xl mx-auto p-4 mt-4"> 

<!-- CATEGORIAS -->
<div class="flex items-center gap-3 mb-8 overflow-x-auto pb-2 scrollbar-none" id="categoryFilters">
<button onclick="setCategory('all')" id="btn-all" class="category-btn active bg-gradient-to-r from-[#00FFFF] to-[#FF00FF] text-black font-extrabold px-5 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all shadow-lg shrink-0">
🚀 Todos
</button>
<button onclick="setCategory('tecnologia')" id="btn-tecnologia" class="category-btn bg-[#121225] text-gray-300 border border-[#2A2A4A] hover:border-[#00FFFF] px-5 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all shrink-0">
💻 Tecnologia
</button>
<button onclick="setCategory('casa')" id="btn-casa" class="category-btn bg-[#121225] text-gray-300 border border-[#2A2A4A] hover:border-[#00FFFF] px-5 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all shrink-0">
🏠 Casa
</button>
<button onclick="setCategory('roupas')" id="btn-roupas" class="category-btn bg-[#121225] text-gray-300 border border-[#2A2A4A] hover:border-[#00FFFF] px-5 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all shrink-0">
👕 Roupas
</button>
<button onclick="setCategory('tenis')" id="btn-tenis" class="category-btn bg-[#121225] text-gray-300 border border-[#2A2A4A] hover:border-[#00FFFF] px-5 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all shrink-0">
👟 Tênis
</button>
<button onclick="setCategory('fones')" id="btn-fones" class="category-btn bg-[#121225] text-gray-300 border border-[#2A2A4A] hover:border-[#00FFFF] px-5 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all shrink-0">
🎧 Fones de Ouvido
</button>
</div> 

<!-- INDICADOR DE CARREGAMENTO -->
<div id="loading" class="text-center py-20 text-gray-400">
<i class="ph ph-spinner animate-spin text-4xl text-[#00FFFF] mb-3 inline-block drop-shadow-[0_0_8px_rgba(0,255,255,0.5)]"></i>
<p class="text-xs uppercase tracking-widest font-semibold">Mapeando ofertas exclusivas...</p>
</div> 

<!-- GRID DE PRODUTOS -->
<div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
<!-- Cards injetados via JavaScript -->
</div> 

<!-- MENSAGEM DE NENHUM RESULTADO -->
<div id="no-results" class="hidden flex flex-col items-center justify-center text-center py-20 bg-[#121225]/50 border border-[#2A2A4A] rounded-3xl mt-4">
<i class="ph ph-magnifying-glass-minus text-5xl text-gray-600 mb-4"></i>
<h3 class="text-base font-bold text-gray-200">Nenhum achadinho encontrado</h3>
<p class="text-sm text-gray-500 mt-2 max-w-sm">Não encontramos nenhum produto com essa busca ou categoria. Tente usar outros termos!</p>
<button onclick="clearSearch()" class="mt-6 text-[#00FFFF] text-sm font-semibold hover:underline">Limpar Filtros</button>
</div> 

</main> 

<!-- BOTÃO FLUTUANTE DO WHATSAPP -->
<a href="https://chat.whatsapp.com/KmdyfhBBW431VuY52SWqsh?mode=gi_t" target="_blank" rel="noopener noreferrer"
class="whatsapp-float fixed bottom-6 right-6 bg-gradient-to-br from-[#25D366] to-[#128C7E] text-white p-4 rounded-full shadow-[0_4px_20px_rgba(37,211,102,0.4)] hover:scale-110 transition-transform z-50 flex items-center justify-center group"
aria-label="Entrar no Grupo do WhatsApp">
<i class="ph ph-whatsapp-logo text-3xl group-hover:drop-shadow-md"></i>
<span class="absolute right-16 bg-white text-black text-xs font-bold px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap shadow-lg hidden md:block">
Participe do Grupo Vip!
</span>
</a> 

<script>
// CONFIGURAÇÃO DO SUPABASE
const SUPABASE_URL = "https://heyidllnarvytnhglywl.supabase.co";
const SUPABASE_KEY = "sb_publishable_qAl-XYoSnxlWQ29LIvBiYw_zBizPZEc";
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 

let allProducts = [];
let currentCategory = 'all'; 

// 1. REGISTRAR ACESSO AO SITE
async function registerPageVisit() {
try {
const { data } = await _supabase.from('metricas').select('views').eq('id', 1).single();
if (data) {
await _supabase.from('metricas').update({ views: (data.views || 0) + 1 }).eq('id', 1);
}
} catch (err) {
console.log("Erro ao registrar visita:", err);
}
} 

// 2. REGISTRAR CLIQUE E ABRIR LINK FORA DO APK
async function trackClick(productId, currentClicks, targetUrl) {
try {
const newClicks = (currentClicks || 0) + 1;
await _supabase.from('produtos').update({ clicks: newClicks }).eq('id', productId);
} catch (err) {
console.log("Erro ao contabilizar clique:", err);
} finally {
// Cria um elemento invisível para forçar a abertura no app da Shopee/navegador do sistema
const link = document.createElement('a');
link.href = targetUrl;
link.target = '_blank';
link.rel = 'noopener noreferrer';
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
} 

// 3. BUSCAR PRODUTOS NA NUVEM
async function fetchProducts() {
const loadingEl = document.getElementById('loading'); 

const { data, error } = await _supabase
.from('produtos')
.select('*')
.order('id', { ascending: false }); 

loadingEl.style.display = 'none'; 

if (error) {
console.error("Erro na base de dados:", error.message);
document.getElementById('no-results').classList.remove('hidden');
return;
} 

if (data && data.length > 0) {
allProducts = data;
applyFilters();
} else {
document.getElementById('no-results').classList.remove('hidden');
}
} 

// 4. CONTROLE DE CATEGORIAS
function setCategory(category) {
currentCategory = category; 

document.querySelectorAll('.category-btn').forEach(btn => {
btn.className = "category-btn bg-[#121225] text-gray-300 border border-[#2A2A4A] hover:border-[#00FFFF] px-5 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all shrink-0";
}); 

const activeBtn = document.getElementById(`btn-${category}`);
if (activeBtn) {
activeBtn.className = "category-btn active bg-gradient-to-r from-[#00FFFF] to-[#FF00FF] text-black font-extrabold px-5 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all shadow-lg shrink-0";
} 

applyFilters();
} 

// 5. APLICAR FILTROS (Pesquisa e Categoria)
function applyFilters() {
const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim(); 

const filtered = allProducts.filter(p => {
const pCategory = (p.platform || p.category || '').toLowerCase();
const pTitle = (p.title || '').toLowerCase(); 

const matchesCategory = currentCategory === 'all' || pCategory === currentCategory;
const matchesSearch = pTitle.includes(searchTerm) || pCategory.includes(searchTerm); 

return matchesCategory && matchesSearch;
}); 

renderProducts(filtered);
} 

// 6. LIMPAR BUSCA
function clearSearch() {
document.getElementById('searchInput').value = '';
setCategory('all');
} 

// 7. RENDERIZAÇÃO DOS PRODUTOS NA TELA
function renderProducts(productsList) {
const grid = document.getElementById('products-grid');
const noResults = document.getElementById('no-results'); 

grid.innerHTML = ''; 

if (productsList.length === 0) {
noResults.classList.remove('hidden');
grid.classList.add('hidden');
return;
} 

noResults.classList.add('hidden');
grid.classList.remove('hidden'); 

productsList.forEach(p => {
const tagText = (p.platform || p.category || 'Oferta').toUpperCase(); 

const cardHTML = `
<div class="bg-[#121225] border border-[#2A2A4A] rounded-3xl p-4 flex flex-col justify-between hover:border-[#00FFFF]/60 hover:shadow-[0_8px_30px_rgba(0,255,255,0.07)] transition-all duration-300 hover:-translate-y-1.5 group">
<div>
<!-- IMAGEM COM EFEITO ZOOM -->
<div class="relative w-full h-52 bg-[#1B1B3A] rounded-2xl overflow-hidden mb-4 border border-[#2A2A4A]">
<img src="${p.image}"
alt="${p.title}"
onerror="this.src='https://via.placeholder.com/400x300/1B1B3A/00FFFF?text=Imagem+Indisponivel'"
class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 ease-in-out"> 

<!-- TAG DINÂMICA DA CATEGORIA -->
<span class="absolute top-3 right-3 text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-full bg-black/60 text-[#00FFFF] border border-[#00FFFF]/30 backdrop-blur-md">
${tagText}
</span>
</div> 

<!-- TÍTULO -->
<h2 class="text-sm font-semibold text-gray-100 line-clamp-2 leading-relaxed mb-4 group-hover:text-[#00FFFF] transition-colors">
${p.title}
</h2>
</div> 

<!-- PREÇO E CTA COM RASTREAMENTO -->
<div class="pt-3 border-t border-[#2A2A4A]/50">
<div class="mb-3 flex flex-col">
<span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Apenas</span>
<span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#00FFFF] to-[#FF00FF]">
R$ ${Number(p.price).toFixed(2).replace('.', ',')}
</span>
</div> 

<button onclick="trackClick(${p.id}, ${p.clicks || 0}, '${p.link}')" class="w-full bg-[#1B1B3A] border border-[#2A2A4A] text-white group-hover:bg-gradient-to-r group-hover:from-[#00FFFF] group-hover:to-[#FF00FF] group-hover:text-black group-hover:border-transparent font-extrabold py-3.5 rounded-xl text-xs uppercase tracking-wider active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 shadow-lg">
Pegar Oferta <i class="ph ph-shopping-bag text-base"></i>
</button>
</div>
</div>`;
grid.innerHTML += cardHTML;
});
} 

// Executa a contagem de acessos e a busca dos produtos ao abrir
registerPageVisit();
fetchProducts();
</script>
</body>
</html>
